{% extends "base.html" %}

{% block titulo %}Novo Usuário{% endblock %}

{% block conteudo %}
<div class="card-form">
    <h2>Cadastrar Novo Usuário</h2>
    <form method="POST" action="{{ url_for('novo_usuario') }}">
        <div class="campo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" required maxlength="100" placeholder="Ex: Maria Silva">
        </div>
        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required maxlength="150" placeholder="maria@exemplo.com">
        </div>
        <div class="acoes">
            <a href="{{ url_for('listar_usuarios') }}" class="btn btn-secundario">Cancelar</a>
            <button type="submit" class="btn btn-primario">Cadastrar</button>
        </div>
    </form>
</div>
{% endblock %}
